<style>
:root {
    --navy: #101a32;
    --navy-light: #192b4c;
    --blue: #2860ee;
    --blue-light: #eef3ff;
    --pink: #ec7891;
    --background: #f7f9fc;
    --white: #ffffff;
    --text: #17213a;
    --muted: #526077;
    --border: #dce3ee;
    --green: #197a56;
    --green-light: #eaf6ef;
    --red: #c94452;
    --red-light: #fff0f1;
    --gold: #9a7022;
    --gold-light: #fbf4e7;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'DM Sans', sans-serif;
    background: var(--background);
    color: var(--text);
    font-size: 14px;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
a:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

[hidden] {
    display: none !important;
}

.label-short {
    display: none;
}

/* TOP STRIP */

.top-strip {
    min-height: 31px;
    background: var(--navy);
    color: #f8fafc;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 5%;
    font-size: 10px;
    letter-spacing: 1px;
    font-weight: 600;
}

.contact-link {
    color: #f7b2c0;
}

/* HEADER */

.main-header {
    min-height: 76px;
    background: var(--white);
    padding: 12px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--border);
}

.school-brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.school-logo {
    width: 46px;
    height: 46px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px;
    display: grid;
    place-items: center;
    overflow: hidden;
    flex-shrink: 0;
}

.school-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.brand-text h2 {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    color: var(--navy);
    font-weight: 500;
}

.brand-text p {
    font-size: 9px;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin-top: 4px;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}

.view-switcher {
    display: inline-flex;
    background: var(--background);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px;
    gap: 4px;
}

.nav-pill {
    min-height: 36px;
    padding: 6px 12px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    border-radius: 4px;
    transition: background-color 0.2s, color 0.2s, transform 0.15s;
}

.nav-pill:hover {
    color: var(--navy);
}

.nav-pill:active {
    transform: scale(0.98);
}

.nav-pill.active {
    background: var(--blue);
    color: var(--white);
}

.portal-label {
    font-size: 10px;
    letter-spacing: 1px;
    font-weight: 700;
    color: var(--blue);
}

.header-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--blue-light);
    color: var(--blue);
    display: grid;
    place-items: center;
    font-weight: 700;
}

/* TOAST BANNER */

.toast-banner {
    width: min(1180px, 90%);
    margin: 16px auto 0;
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--text);
}

.toast-banner.success {
    background: var(--green-light);
    border-color: #9dd4bd;
    color: #11583e;
}

.toast-banner.error {
    background: var(--red-light);
    border-color: #efb8be;
    color: #8f2430;
}

/* MAIN CONTAINER */

.page-container {
    width: min(1180px, 90%);
    margin: auto;
}

.page-intro {
    padding: 40px 0 30px;
}

.eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 10px;
    letter-spacing: 1.1px;
    font-weight: 700;
    color: var(--blue);
}

.pink-line {
    width: 19px;
    height: 2px;
    background: var(--pink);
}

.intro-content {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    margin-top: 16px;
}

.intro-content h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(30px, 4vw, 43px);
    font-weight: 400;
    letter-spacing: -1px;
    line-height: 1.15;
}

h1 em,
h2 em {
    color: var(--blue);
    font-weight: 400;
}

.intro-content p {
    color: var(--muted);
    margin-top: 12px;
    font-size: 13px;
    max-width: 560px;
    line-height: 1.7;
}

.date-display {
    min-width: 175px;
    padding: 14px 17px;
    background: var(--white);
    border: 1px solid var(--border);
}

.date-label {
    display: block;
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-weight: 600;
}

.date-display strong {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
}

.principal-date-controls {
    display: flex;
    align-items: flex-end;
    gap: 12px;
}

/* SECTION HEADINGS */

.filter-section,
.statistics-section,
.attendance-section {
    margin-bottom: 44px;
}

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    margin-bottom: 22px;
}

.section-heading h2 {
    font-family: 'Playfair Display', serif;
    font-size: 25px;
    font-weight: 400;
    margin-top: 9px;
}

.section-heading > p {
    font-size: 12px;
    color: var(--muted);
    max-width: 320px;
    line-height: 1.6;
}

/* FILTER SECTION */

.filter-section {
    background: var(--white);
    border: 1px solid var(--border);
    padding: 26px;
}

.filter-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1.2fr auto;
    gap: 15px;
    align-items: end;
}

.form-group label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 8px;
}

.form-group select,
.form-group input {
    height: 44px;
    width: 100%;
    border: 1px solid var(--border);
    background: #fbfcfe;
    padding: 0 12px;
    color: var(--text);
    font-size: 13px;
    border-radius: 3px;
}

.form-group select:focus,
.form-group input:focus {
    border-color: var(--blue);
}

/* BUTTONS */

.primary-button {
    min-height: 44px;
    padding: 0 20px;
    background: var(--blue);
    color: var(--white);
    border: 1px solid var(--blue);
    border-radius: 5px;
    font-size: 12px;
    font-weight: 600;
    transition: background-color 0.2s, border-color 0.2s, transform 0.15s;
}

.primary-button span {
    margin-left: 8px;
}

.primary-button:hover:not(:disabled) {
    background: #1749ca;
    border-color: #1749ca;
}

.primary-button:active:not(:disabled) {
    transform: scale(0.98);
}

.outline-button {
    min-height: 44px;
    padding: 0 15px;
    background: var(--white);
    color: var(--blue);
    border: 1px solid #cbd7f2;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    transition: background-color 0.2s, transform 0.15s;
}

.outline-button:hover:not(:disabled) {
    background: var(--blue-light);
}

.outline-button:active:not(:disabled) {
    transform: scale(0.98);
}

.outline-button.small-action {
    min-height: 36px;
    padding: 0 12px;
    font-size: 11px;
}

.outline-button.absent-outline {
    color: var(--red);
    border-color: #efb8be;
}

.outline-button.absent-outline:hover:not(:disabled) {
    background: var(--red-light);
}

.toolbar-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.reset-button {
    min-height: 44px;
    padding: 0 20px;
    border: 1px solid #cbd5e1;
    background: var(--white);
    color: var(--navy);
    border-radius: 5px;
    font-size: 12px;
    font-weight: 500;
    transition: background-color 0.2s, transform 0.15s;
}

.reset-button:hover:not(:disabled) {
    background: #f1f5f9;
}

.reset-button:active:not(:disabled) {
    transform: scale(0.98);
}

/* STATISTICS */

.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border: 1px solid var(--border);
    background: var(--white);
}

.stat-card {
    padding: 22px;
    border-right: 1px solid var(--border);
    min-width: 0;
}

.stat-card:last-child {
    border-right: none;
}

.stat-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.stat-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 17px;
    font-weight: 700;
}

.stat-icon.blue {
    color: var(--blue);
    background: var(--blue-light);
}

.stat-icon.green {
    color: var(--green);
    background: var(--green-light);
}

.stat-icon.red {
    color: var(--red);
    background: var(--red-light);
}

.stat-icon.gold {
    color: var(--gold);
    background: var(--gold-light);
}

.stat-caption {
    font-size: 10px;
    color: var(--muted);
    font-weight: 600;
}

.stat-card > p {
    color: var(--muted);
    font-size: 12px;
}

.stat-card h3 {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 400;
    margin: 6px 0;
    font-variant-numeric: tabular-nums;
}

.stat-card small {
    color: var(--muted);
    font-size: 11px;
}

/* ATTENDANCE TABLE */

.attendance-title {
    margin-bottom: 20px;
}

.attendance-title .section-description {
    font-size: 12px;
    color: var(--muted);
    margin-top: 7px;
}

.status-badges {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.record-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 3px;
    background: var(--gold-light);
    color: var(--gold);
    border: 1px solid #ebd7b0;
}

.record-badge.saved {
    background: var(--green-light);
    color: var(--green);
    border-color: #b4dfc9;
}

.student-count {
    font-size: 11px;
    font-weight: 600;
    color: var(--blue);
    background: var(--blue-light);
    padding: 8px 13px;
    border-radius: 3px;
    font-variant-numeric: tabular-nums;
}

.table-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}

.search-box {
    width: min(380px, 100%);
    height: 44px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--border);
    background: var(--white);
    padding: 0 13px;
    border-radius: 3px;
}

.search-box span {
    color: var(--blue);
    font-size: 20px;
}

.search-box input {
    flex: 1;
    width: 100%;
    border: none;
    outline: none;
    font-size: 12px;
    color: var(--text);
    background: transparent;
}

.table-container {
    background: var(--white);
    border: 1px solid var(--border);
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 590px;
    border-collapse: collapse;
}

thead {
    background: #f0f4fa;
}

th {
    padding: 14px 18px;
    text-align: left;
    font-size: 10px;
    letter-spacing: 0.8px;
    color: var(--navy-light);
    font-weight: 700;
}

td {
    padding: 14px 18px;
    border-top: 1px solid #edf0f5;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
}

tbody tr:hover {
    background: #fbfcff;
}

.table-empty {
    text-align: center;
    color: var(--muted);
    padding: 28px 16px;
}

.roll-number {
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
}

.student-name {
    font-weight: 600;
    color: var(--navy);
}

.pill-badge {
    display: inline-block;
    padding: 4px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
}

.pill-badge.submitted {
    background: var(--green-light);
    color: var(--green);
}

.pill-badge.pending {
    background: var(--gold-light);
    color: var(--gold);
}

/* PRESENT AND ABSENT BUTTONS */

.status-buttons {
    display: flex;
    align-items: center;
    gap: 8px;
}

.status-btn {
    min-width: 92px;
    min-height: 40px;
    padding: 8px 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--white);
    font-size: 12px;
    font-weight: 600;
    transition: background-color 0.2s, color 0.2s, border-color 0.2s, transform 0.15s;
}

.status-btn:active {
    transform: scale(0.98);
}

.present-btn {
    color: var(--green);
}

.present-btn.selected {
    color: var(--white);
    background: var(--green);
    border-color: var(--green);
}

.absent-btn {
    color: var(--red);
}

.absent-btn.selected {
    color: var(--white);
    background: var(--red);
    border-color: var(--red);
}

/* ATTENDANCE ACTIONS */

.attendance-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 17px 0;
}

.attendance-note {
    color: var(--muted);
    font-size: 12px;
}

.attendance-note span {
    color: var(--pink);
    margin-right: 5px;
}

.action-buttons {
    display: flex;
    gap: 10px;
}

/* RESULT SECTION */

.result-section {
    background: var(--white);
    border: 1px solid var(--border);
    border-left: 3px solid var(--green);
    padding: 25px;
    margin-bottom: 35px;
}

.result-section h2 {
    font-family: 'Playfair Display', serif;
    font-size: 23px;
    font-weight: 400;
    margin-top: 12px;
}

#resultMessage {
    color: var(--muted);
    font-size: 12px;
    margin: 12px 0;
}

#resultDetails {
    font-size: 13px;
    line-height: 1.9;
}

#resultDetails ul {
    padding-left: 20px;
    margin-top: 8px;
}

/* MODALS */

.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(16, 26, 50, 0.55);
    display: grid;
    place-items: center;
    padding: 20px;
    z-index: 50;
}

.modal-card {
    width: min(420px, 100%);
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 24px;
    box-shadow: 0 20px 40px rgba(16, 26, 50, 0.18);
}

.modal-card h3 {
    font-family: 'Playfair Display', serif;
    font-size: 21px;
    font-weight: 500;
    color: var(--navy);
    margin-bottom: 10px;
}

.modal-card p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 16px;
}

.modal-error {
    color: var(--red) !important;
    font-weight: 600;
    margin-top: 8px !important;
    margin-bottom: 0 !important;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

/* BOTTOM MESSAGE */

.bottom-message {
    background: var(--navy);
    color: var(--white);
    padding: 38px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 25px;
    margin: 50px 0 0;
}

.light-eyebrow {
    color: #f6a2b5;
}

.bottom-message h2 {
    font-family: 'Playfair Display', serif;
    font-weight: 400;
    font-size: 25px;
    line-height: 1.35;
    margin-top: 13px;
}

.bottom-message h2 em {
    color: #b9ccff;
}

.bottom-message > p {
    max-width: 340px;
    color: #d2dae7;
    font-size: 12px;
    line-height: 1.8;
}

/* FOOTER */

.main-footer {
    background: var(--navy);
    color: var(--white);
    padding: 40px 5% 0;
    border-top: 2px solid var(--blue);
}

.footer-content {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 50px;
    padding-bottom: 35px;
}

.footer-logo {
    background: var(--white);
    color: var(--blue);
}

.footer-brand > p {
    max-width: 300px;
    margin-top: 18px;
    color: #cbd5e1;
    font-size: 11px;
    line-height: 1.8;
}

.footer-brand .brand-text h2 {
    color: var(--white);
}

.footer-brand .brand-text p {
    color: #cbd5e1;
}

.footer-links {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.footer-links h3 {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 5px;
}

.footer-links a,
.footer-links span {
    color: #cbd5e1;
    text-decoration: none;
    font-size: 11px;
}

.footer-links a:hover {
    color: var(--white);
}

.footer-bottom {
    border-top: 1px solid rgba(255, 255, 255, 0.14);
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 17px 0;
    color: #cbd5e1;
    font-size: 10px;
}

@media (prefers-reduced-motion: reduce) {
    html {
        scroll-behavior: auto;
    }
    * {
        transition-duration: 0.01ms !important;
    }
}

/* TABLET RESPONSIVENESS */

@media (max-width: 900px) {
    .filter-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .stat-card:nth-child(2) {
        border-right: none;
    }

    .stat-card:nth-child(1),
    .stat-card:nth-child(2) {
        border-bottom: 1px solid var(--border);
    }
}

/* MOBILE RESPONSIVENESS */

@media (max-width: 600px) {
    .top-strip {
        padding: 4px 4%;
        font-size: 8px;
    }

    .main-header {
        padding: 10px 3.5%;
        min-height: 60px;
        gap: 8px;
        flex-wrap: nowrap;
    }

    .school-brand {
        gap: 8px;
        min-width: 0;
        flex: 1;
    }

    .school-logo {
        width: 34px;
        height: 34px;
    }

    .brand-text {
        min-width: 0;
    }

    .brand-text h2 {
        font-size: 13px;
        line-height: 1.15;
    }

    .brand-text p {
        font-size: 7px;
        letter-spacing: 0.5px;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .portal-label {
        display: none;
    }

    .header-actions {
        gap: 6px;
        flex-wrap: nowrap;
        flex-shrink: 0;
    }

    .label-full {
        display: none;
    }

    .label-short {
        display: inline;
    }

    .view-switcher {
        padding: 2px;
        gap: 2px;
    }

    .nav-pill {
        min-width: 34px;
        min-height: 34px;
        padding: 0 10px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
    }

    .header-avatar {
        width: 28px;
        height: 28px;
        font-size: 12px;
        flex-shrink: 0;
    }

    .page-container {
        width: 92%;
    }

    .page-intro {
        padding: 28px 0 24px;
    }

    #teacherView .intro-content {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }

    #teacherView .intro-content > div:first-child {
        min-width: 0;
        flex: 1;
    }

    #teacherView .intro-content h1 {
        font-size: clamp(20px, 5.5vw, 26px);
    }

    #teacherView .intro-content p {
        font-size: 11px;
        line-height: 1.45;
        margin-top: 6px;
    }

    #teacherView .date-display {
        width: auto;
        min-width: 112px;
        max-width: 142px;
        padding: 10px 11px;
        flex-shrink: 0;
    }

    #teacherView .date-display strong {
        font-size: 12px;
    }

    #principalView .intro-content {
        flex-direction: column;
        align-items: flex-start;
    }

    #principalView .intro-content h1 {
        font-size: 28px;
    }

    .principal-date-controls {
